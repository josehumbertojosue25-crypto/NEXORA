name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar dependências Node
        run: npm install

      - name: Compilar aplicação web (Vite/React)
        run: npm run build

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar Capacitor e Compilar APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK gerado (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nexora-jh-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

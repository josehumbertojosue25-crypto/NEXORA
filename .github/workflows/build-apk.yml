name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Compilar Aplicação Web (Vite)
        run: npm run build

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Aceitar Licenças do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copiar Assets e Sincronizar Capacitor
        run: |
          npx cap copy android
          npx cap sync android

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK gerado (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nexora-jh-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
